[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-intelligence"
version = "0.1.0"
description = "Knowledge intelligence platform for TME Engineering documentation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pypdf>=6.0,<7.0",
    "python-docx>=1.2,<2.0",
    "pymupdf>=1.26,<2.0",
    "pyyaml>=6.0,<7.0",
    "slack-sdk>=3.30,<4.0",
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=1.0,<3.0",
    "strands-agents[openai]>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[s3]>=1.42,<2.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "types-pyyaml>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "scripts"]
